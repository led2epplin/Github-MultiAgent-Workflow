name: harness
# ready 티켓이 있으면 일회용 우분투에서 build/run_ticket.sh 를 돌린다. 상태는 전부 저장소에 push 된다.
on:
  push:                       # 오케스트레이터가 티켓을 push 하면 즉시 (러너 자신의 push 는 GITHUB_TOKEN 이라 재귀 없음)
    branches: [main]
    paths: ["tickets/open/**"]
  schedule:                   # 예비. GitHub 는 잦은 cron 을 크게 늦춘다(실측 4~5시간 간격) — 즉시성은 push/수동 실행이 맡는다
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "시간 예산(분)"
        default: "50"
      dry_run:
        description: "1 이면 claude 없이 스모크 티켓만(domain/smoke.py)"
        default: "0"
      no_pr:
        description: "1 이면 PR 없이 main 직접(스모크 전용)"
        default: "0"

concurrency:
  group: harness
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ready 티켓 확인
        id: ready
        run: |
          pip install -q pyyaml
          if T=$(python3 build/ready --one); then echo "ticket=$T" >> "$GITHUB_OUTPUT"; echo "ready: $T"; else echo "ticket=" >> "$GITHUB_OUTPUT"; echo "ready 없음"; fi

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ticket != '' && inputs.dry_run != '1'
        with:
          node-version: 22

      - name: Claude Code 설치
        if: steps.ready.outputs.ticket != '' && inputs.dry_run != '1'
        run: npm i -g @anthropic-ai/claude-code && claude --version

      - name: 토큰 점검 (값은 출력하지 않음)
        if: steps.ready.outputs.ticket != '' && inputs.dry_run != '1'
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then echo "::error::CLAUDE_CODE_OAUTH_TOKEN 비밀이 비어 있음 — 이 저장소 Settings→Secrets and variables→Actions→Repository secrets 에 같은 이름으로 있어야 한다(Variables 탭·다른 저장소·Environment 비밀은 안 읽힘)"; exit 1; fi
          echo "토큰 길이=${#TOK} 접두=${TOK:0:12} 공백문자=$(printf %s "$TOK" | tr -cd '[:space:]' | wc -c)"
          case "$TOK" in sk-ant-oat01-*) echo "형식: 구독 OAuth 토큰(정상)";; sk-ant-api*) echo "::warning::API 키 형식 — CLAUDE_CODE_OAUTH_TOKEN 이 아니라 ANTHROPIC_API_KEY 로 넣어야 함";; *) echo "::warning::알 수 없는 형식 — claude setup-token 출력 전체인지 확인";; esac

      - name: 하니스 실행
        if: steps.ready.outputs.ticket != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          GH_TOKEN: ${{ github.token }}
          HARNESS_RUNNER: gha-${{ github.run_id }}
          HARNESS_TRUST: "1"
          BUDGET_MIN: ${{ inputs.budget_min || '50' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          NO_PR: ${{ inputs.no_pr || '0' }}
        run: |
          git config user.name "hj2-harness"
          git config user.email "hj2-harness@users.noreply.github.com"
          bash build/run_ticket.sh

      - uses: actions/upload-artifact@v4
        if: always() && steps.ready.outputs.ticket != ''
        with:
          name: runs-${{ github.run_id }}
          path: runs/
          if-no-files-found: ignore
