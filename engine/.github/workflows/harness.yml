name: harness
# ready 티켓이 있으면 일회용 우분투에서 build/run_ticket.sh 를 돌린다. 상태는 전부 저장소에 push 된다. 규칙: .mawf/WORKFLOW.md §7·§8
# 벤더별 부분(작업자 CLI 설치·토큰 비밀 이름·커밋 작성자)은 소비 저장소 .mawf.yaml runner 와 어댑터(.mawf/runner/)에서 읽는다.
on:
  push:                       # 오케스트레이터가 티켓을 push 하면 즉시 (러너 자신의 push 는 GITHUB_TOKEN 이라 재귀 없음)
    branches: [main]
    paths: ["tickets/open/**", "tickets/done/**"]   # done 전이가 blocked_by 를 풀어 다음 장을 ready 로 만든다 — 병합 후 수동 dispatch 불요
  schedule:                   # 예비. GitHub 는 잦은 cron 을 크게 늦춘다(실측 4~5시간 간격) — 즉시성은 push/수동 실행이 맡는다
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "시간 예산(분)"
        default: "50"
      dry_run:
        description: "1 이면 작업자 실행기 없이 스모크 티켓만(domain/smoke.py)"
        default: "0"
      no_pr:
        description: "1 이면 PR 없이 main 직접(스모크 전용)"
        default: "0"

concurrency:
  group: harness
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HARNESS_RUNNER: gha-${{ github.run_id }}
      MAIN_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 매니페스트 · 엔진 동기화
        id: cfg
        run: |
          pip install -q pyyaml
          python3 build/engine_sync --runner-cfg | tee -a "$GITHUB_OUTPUT"
          git config user.name "$(python3 build/engine_sync --runner-cfg git_name)"
          git config user.email "$(python3 build/engine_sync --runner-cfg git_email)"
          python3 build/engine_sync
          if [ -n "$(git status --porcelain)" ]; then
            git add -A && git commit -qm "engine sync ($HARNESS_RUNNER)" && git push -q origin "HEAD:$MAIN_BRANCH" \
              || { echo "::warning::엔진 동기화 커밋 push 실패 — 워크플로 파일이 바뀐 갱신은 대화형 세션이 커밋한다. 이번 실행은 현재 판으로 계속"; git reset -q --hard "origin/$MAIN_BRANCH"; }
          fi

      - name: 역할표 · ready 티켓 확인
        id: ready
        run: |
          if ! python3 build/engine_sync --roles; then echo "ticket=" >> "$GITHUB_OUTPUT"; echo "역할표 미정·대화 창구 — claim 없음"; exit 0; fi
          if T=$(python3 build/ready --one); then echo "ticket=$T" >> "$GITHUB_OUTPUT"; echo "ready: $T"; else echo "ticket=" >> "$GITHUB_OUTPUT"; echo "ready 없음"; fi

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ticket != '' && inputs.dry_run != '1' && steps.cfg.outputs.node != ''
        with:
          node-version: ${{ steps.cfg.outputs.node }}

      - name: 작업자 실행기 준비 (토큰 값은 출력하지 않음)
        if: steps.ready.outputs.ticket != '' && inputs.dry_run != '1'
        env:
          MAWF_RUNNER_TOKEN: ${{ secrets[steps.cfg.outputs.token_secret] }}
          TOKEN_SECRET: ${{ steps.cfg.outputs.token_secret }}
        run: |
          if [ -n "$TOKEN_SECRET" ] && [ -z "$MAWF_RUNNER_TOKEN" ]; then echo "::error::저장소 비밀 $TOKEN_SECRET 이 비어 있음 — 이 저장소 Settings→Secrets and variables→Actions→Repository secrets 에 같은 이름으로 있어야 한다(Variables 탭·다른 저장소·Environment 비밀은 안 읽힘)"; exit 1; fi
          if [ -f .mawf/runner_setup.sh ]; then bash .mawf/runner_setup.sh
          elif [ -f .mawf/runner/setup.sh ]; then bash .mawf/runner/setup.sh
          else echo "실행기 준비 스크립트 없음 — 건너뜀"; fi

      - name: 하니스 실행
        if: steps.ready.outputs.ticket != ''
        env:
          MAWF_RUNNER_TOKEN: ${{ secrets[steps.cfg.outputs.token_secret] }}
          GH_TOKEN: ${{ github.token }}
          BUDGET_MIN: ${{ inputs.budget_min || '50' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          NO_PR: ${{ inputs.no_pr || '0' }}
        run: bash build/run_ticket.sh

      - uses: actions/upload-artifact@v4
        if: always() && steps.ready.outputs.ticket != ''
        with:
          name: runs-${{ github.run_id }}
          path: runs/
          if-no-files-found: ignore
